name: Prepare release
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop release execution ID
        required: true
        type: string
      beepboop_title:
        description: Release title
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/beepboop/actions/begin@v1
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: prepare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: kjanat/beepboop/actions/prepare@v1
        with:
          context: ${{ steps.release.outputs.context }}
          mode: apply
      - run: bun install --force
      - run: bun run typecheck
      - run: bun run test
      - run: bun test
      - run: bun run check:dist
      - uses: kjanat/beepboop/actions/prepare@v1
        with:
          context: ${{ steps.release.outputs.context }}
          mode: submit
