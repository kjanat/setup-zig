name: Publish action
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop release execution ID
        required: true
        type: string
      beepboop_title:
        description: Release title
        type: string
permissions:
  contents: read
concurrency:
  group: publish-action
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/beepboop/actions/begin@v1
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:dist
      - name: Attest the built action bundles
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/main.mjs
            dist/post.mjs
      - uses: kjanat/beepboop/actions/token@v1
        id: token
        with: { permission-contents: write }
      - name: Commit, tag, and record distribution ancestry
        id: distribution
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_SHA: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          RELEASE_VERSION: ${{ fromJSON(steps.release.outputs.context).version }}
        run: |
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(node -p "require('./package.json').version")" == "${RELEASE_VERSION}" ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq '.object.sha')" == "${SOURCE_SHA}" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SOURCE_SHA}" --jq '.verification.verified')" == true ]]
          tags=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${RELEASE_VERSION}")
          jq -e --arg ref "refs/tags/v${RELEASE_VERSION}" 'all(.[][]; .ref != $ref)' <<< "${tags}"
          releases=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          jq -e --arg tag "v${RELEASE_VERSION}" 'all(.[][]; .tag_name != $tag)' <<< "${releases}"
          gh auth setup-git
          git fetch --no-tags --unshallow origin "${SOURCE_SHA}"
          major=${RELEASE_VERSION%%.*}
          branch="releases/v${major}"
          branches=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}")
          previous=$(jq -r --arg ref "refs/heads/${branch}" '.[] | select(.ref == $ref) | .object.sha' <<< "${branches}")
          if [[ -n "${previous}" ]]; then
            git fetch --no-tags origin "${previous}"
            git merge-base --is-ancestor "${previous}" "${SOURCE_SHA}"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" -f sha="${SOURCE_SHA}" -F force=false
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${branch}" -f sha="${SOURCE_SHA}"
          fi
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" --arg branch "${branch}" \
            --arg source "${SOURCE_SHA}" --arg version "${RELEASE_VERSION}" \
            --rawfile main dist/main.mjs --rawfile post dist/post.mjs \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid } } } }", variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $source, message: {headline: ("Build " + $version + " distribution")}, fileChanges: {additions: [{path: "dist/main.mjs", contents: ($main | @base64)}, {path: "dist/post.mjs", contents: ($post | @base64)}]}}}}' \
            | gh api graphql --input - > "${RUNNER_TEMP}/distribution-commit.json"
          jq -e '.data.createCommitOnBranch.commit.signature.isValid == true' "${RUNNER_TEMP}/distribution-commit.json"
          commit=$(jq -r '.data.createCommitOnBranch.commit.oid' "${RUNNER_TEMP}/distribution-commit.json")
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${commit}" --jq '.verification.verified')" == true ]]
          git fetch --no-tags origin "${commit}"
          [[ "$(git rev-parse "${commit}^1")" == "${SOURCE_SHA}" ]]
          diff -u <(printf 'dist/main.mjs\ndist/post.mjs\n') <(git diff-tree --no-commit-id --name-only -r "${commit}")
          for file in dist/main.mjs dist/post.mjs; do
            [[ "$(git rev-parse "${commit}:${file}")" == "$(git hash-object "${file}")" ]]
          done
          tree=$(git rev-parse "${SOURCE_SHA}^{tree}")
          ancestry=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message="Record ${RELEASE_VERSION} distribution ancestry" -f tree="${tree}" \
            -f "parents[]=${SOURCE_SHA}" -f "parents[]=${commit}" --jq '.sha')
          git fetch --no-tags origin "${ancestry}"
          [[ "$(git rev-parse "${ancestry}^{tree}")" == "${tree}" ]]
          git merge-base --is-ancestor "${commit}" "${ancestry}"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq '.object.sha')" == "${SOURCE_SHA}" ]]
          git push --atomic origin "${ancestry}:refs/heads/${default_branch}" "${commit}:refs/tags/v${RELEASE_VERSION}"
          echo "sha=${commit}" >> "${GITHUB_OUTPUT}"
      - name: Generate release notes from source commits
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_SHA: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          RELEASE_VERSION: ${{ fromJSON(steps.release.outputs.context).version }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const { SOURCE_SHA: source, RELEASE_VERSION: version, GITHUB_REPOSITORY: repository, RUNNER_TEMP: temp } = process.env;
          const parts = value => value.replace(/^v/, '').split('.').map(Number);
          const compare = (a, b) => {
            const left = parts(a), right = parts(b);
            return left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
          };
          const tags = git('ls-remote', '--tags', '--refs', 'origin', 'v*.*.*')
            .split('\n').map(line => line.split('\t')[1]?.replace('refs/tags/', ''))
            .filter(tag => tag && /^v\d+\.\d+\.\d+$/.test(tag) && compare(tag, version) < 0)
            .sort(compare);
          const previous = tags.at(-1);
          let range = source;
          if (previous) {
            git('fetch', '--no-tags', 'origin', `refs/tags/${previous}`);
            range = `${git('rev-parse', 'FETCH_HEAD')}..${source}`;
          }
          const commits = git('log', '--first-parent', '--no-merges', '--reverse', '--format=%H%x09%s', range)
            .split('\n').filter(Boolean).map(line => {
              const separator = line.indexOf('\t');
              return { sha: line.slice(0, separator), subject: line.slice(separator + 1) };
            }).filter(commit => !/^(?:Prepare|Release|Bump(?: version)?)(?: to)? v?\d+\.\d+\.\d+$/i.test(commit.subject));
          const base = `${process.env.GITHUB_SERVER_URL}/${repository}`;
          const escape = text => text.replace(/[\\`*_[\]<>]/g, character => `\\${character}`);
          const changes = commits.map(commit => `- ${escape(commit.subject)} ([${commit.sha.slice(0, 7)}](${base}/commit/${commit.sha}))`);
          const changelog = previous
            ? `${base}/compare/${previous}...v${version}`
            : `${base}/commits/v${version}`;
          const notes = `## Changes\n\n${changes.join('\n') || `- Release v${version}.`}\n\n**Full Changelog**: ${changelog}\n`;
          writeFileSync(join(temp, 'release-notes.md'), notes);
          console.log(notes);
          NODE
      - name: Publish the immutable patch Release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_VERSION: ${{ fromJSON(steps.release.outputs.context).version }}
        run: |
          gh release create "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --draft --title "v${RELEASE_VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          gh release upload "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" \
            dist/main.mjs dist/post.mjs
          gh release edit "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}" --jq '.immutable and (.draft | not)')" == true ]]
      - name: Update major and minor refs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_VERSION: ${{ fromJSON(steps.release.outputs.context).version }}
          DISTRIBUTION_SHA: ${{ steps.distribution.outputs.sha }}
        run: |
          major=${RELEASE_VERSION%%.*}
          minor=${RELEASE_VERSION%.*}
          for alias in "v${major}" "v${minor}"; do
            refs=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${alias}")
            previous=$(jq -r --arg ref "refs/tags/${alias}" '.[] | select(.ref == $ref) | .object.sha' <<< "${refs}")
            git push --force-with-lease="refs/tags/${alias}:${previous}" origin "${DISTRIBUTION_SHA}:refs/tags/${alias}"
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${alias}" --jq '.object.sha')" == "${DISTRIBUTION_SHA}" ]]
          done
