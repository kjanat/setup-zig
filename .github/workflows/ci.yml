name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Tests and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check:dist
      - name: Lint action and workflows
        run: bun run actionlint --ignore unpinned-reference
  smoke:
    name: Install on ${{ matrix.os }} (tool cache ${{ matrix.tool-cache }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        tool-cache: ['true', 'false']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Write project manifest
        shell: bash
        run: |
          mkdir project
          cat > project/build.zig.zon <<'ZON'
          .{
              .name = .test_project,
              .version = "0.0.0",
              // .minimum_zig_version = "0.11.0",
              .minimum_zig_version = "0.15.2",
              .paths = .{""},
          }
          ZON
      - name: Install from manifest
        id: zig
        uses: ./
        with:
          manifest-path: project/build.zig.zon
          use-tool-cache: ${{ matrix.tool-cache }}
      - name: Check compiler and outputs
        shell: bash
        env:
          ZIG_VERSION: ${{ steps.zig.outputs.version }}
          ZIG_PATH: ${{ steps.zig.outputs.path }}
        run: |
          test "$ZIG_VERSION" = '0.15.2'
          test -d "$ZIG_PATH"
          test "$(zig version)" = "$ZIG_VERSION"
          mkdir smoke
          cd smoke
          zig init
          zig build test
      - name: Reuse compiler installation
        uses: ./
        with:
          version: '0.15.2'
          use-tool-cache: ${{ matrix.tool-cache }}
  versions:
    name: Resolve Zig ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['0.14.0', '0.14.1', latest, master]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./
        with:
          version: ${{ matrix.version }}
          use-cache: false
      - run: zig version
