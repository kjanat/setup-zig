name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 10
    name: Tests and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --force
      - run: bun run typecheck
      - run: bun run test
      - run: bun test
      - run: bun run check:dist
      - name: Lint action and workflows
        run: bun run actionlint --ignore unpinned-reference
  smoke:
    timeout-minutes: 20
    name: Install on ${{ matrix.os }} (tool cache ${{ matrix.tool-cache }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest]
        tool-cache: ["true", "false"]
        zig-version: ["0.15.2"]
        include:
          # Zig 0.15.2 cannot link its build runner on macOS 26.
          - os: macos-latest
            tool-cache: "true"
            zig-version: "0.17.1"
          - os: macos-latest
            tool-cache: "false"
            zig-version: "0.17.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --force
      - run: bun run build
      - name: Write project manifest
        shell: bash
        env:
          ZIG_VERSION: ${{ matrix.zig-version }}
        run: |
          mkdir project
          cat > project/build.zig.zon <<ZON
          .{
              .name = .test_project,
              .version = "0.0.0",
              // .minimum_zig_version = "0.11.0",
              .minimum_zig_version = "$ZIG_VERSION",
              .paths = .{""},
          }
          ZON
      - name: Install from manifest
        id: zig
        uses: ./
        with:
          manifest-path: project/build.zig.zon
          use-tool-cache: ${{ matrix.tool-cache }}
          cache-key: tool-cache-${{ matrix.tool-cache }}
      - name: Check compiler and outputs
        shell: bash
        env:
          EXPECTED_ZIG_VERSION: ${{ matrix.zig-version }}
          ZIG_VERSION: ${{ steps.zig.outputs.version }}
          ZIG_PATH: ${{ steps.zig.outputs.path }}
        run: |
          test "$ZIG_VERSION" = "$EXPECTED_ZIG_VERSION"
          test -d "$ZIG_PATH"
          test "$(zig version)" = "$ZIG_VERSION"
          mkdir smoke
          cd smoke
          zig init
          zig build test
      - name: Reuse compiler installation
        uses: ./
        with:
          version: ${{ matrix.zig-version }}
          use-tool-cache: ${{ matrix.tool-cache }}
          use-cache: false
  versions:
    timeout-minutes: 15
    name: Resolve Zig ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["0.14.0", "0.14.1", latest, master]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --force
      - run: bun run build
      - uses: ./
        with:
          version: ${{ matrix.version }}
          use-cache: false
      - run: zig version
