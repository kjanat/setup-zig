name: Extended version tests
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  test-from-project:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --force
      - run: bun run build
      - name: "Create build.zig.zon"
        run: |
          cat >build.zig.zon <<EOF
          .{
              .name = "test-project",
              .version = "0.0.0",
              .minimum_zig_version = "0.13.0",
              .paths = .{""},
              .fingerprint = 0x43eaf07faceda5c3,
          }
          EOF
      - name: "Setup Zig"
        uses: "./"
      - name: "Check `zig version`"
        run: |
          if [ "$(zig version)" != '0.13.0' ]; then
            echo "version mismatch: expected '0.13.0', got '$(zig version)'"
            exit 1
          fi
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig_version:
          - "master"
          - "latest"
          - "2024.5.0-mach"
          - "0.14.0"
          - "0.14.1" # zig-linux-x86_64 -> zig-x86_64-linux
          - "0.15.0"
          - "0.15.1" # armv7a -> arm (though testing on ARM is TODO!)
          - "0.15.2" # some x.x.2
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --force
      - run: bun run build
      - name: "Setup Zig"
        uses: "./"
        with: { version: "${{ matrix.zig_version }}" }
      - name: "Test `zig init`"
        run: |
          mkdir init
          cd init
          zig init
          zig build test
